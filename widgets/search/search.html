<div class="search-widget">
  <form class="search-form" role="search" action="" method="get">
    <label class="search-label" for="search-widget-input">Search Microsoft.com</label>
    <div class="search-field">
      <input id="search-widget-input" class="search-input" type="search" name="q" maxlength="200" autocomplete="off">
      <button class="search-submit" type="submit">Search</button>
    </div>
  </form>
  <p class="search-summary" aria-live="polite"></p>
  <ol class="search-results"></ol>
  <nav class="search-pages" aria-label="Search result pages"></nav>
</div>
